name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Permissions the GITHUB_TOKEN needs to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # Bundle the audio into the Pages artifact instead of hotlinking GitHub
      # Releases. Pages serves .mp3 as audio/mpeg (inline) with range support,
      # which iOS requires; Releases serve application/octet-stream (attachment),
      # which iOS refuses to play. Files ride along in the deploy, never in git.
      - name: Fetch audio assets into build
        run: |
          mkdir -p dist/audio
          for i in $(seq 1 10); do
            curl -sSfL \
              "https://github.com/Aryaman73/noize/releases/download/audio-v1/a${i}.mp3" \
              -o "dist/audio/a${i}.mp3"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
